/* Career Deck — tampilan. Token warna: terang di :root, gelap di media query + data-theme. */

}

.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ shell */
.app { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; height: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font: 700 1rem/1 var(--font-display); letter-spacing: -.02em; white-space: nowrap; }
.brand-sub { font-size: .7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }

  padding: 4px 10px 4px 4px; cursor: pointer; max-width: 46vw;
}

.userchip .nm { font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 599px) { .topbar .ver { display: none; } .topbar { gap: 8px; } }
@media (max-width: 440px) { .userchip .nm { display: none; } .userchip { padding: 4px; } }
.menu {
  position: absolute; right: 12px; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) - 4px); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow-lg); padding: 6px; min-width: 220px; z-index: 40;
}
.menu button, .menu a { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 7px; cursor: pointer; text-align: left; color: var(--ink); text-decoration: none; font-size: .9rem; }
.menu button:hover, .menu a:hover { background: var(--surface-2); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
.menu .linkbtn { display: inline; width: auto; padding: 2px 4px; background: none; color: var(--accent); font-weight: 700; font-size: .8rem; }
.menu .linkbtn:hover { background: none; text-decoration: underline; }

.layout { flex: 1; display: grid; grid-template-columns: 1fr; }
.sidenav { display: none; }
.main { min-width: 0; padding: 18px 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); max-width: 1180px; width: 100%; margin: 0 auto; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; text-decoration: none; color: var(--muted); font-size: .68rem; font-weight: 600; border-radius: 10px; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.on { color: var(--accent); }
.tabbar a.on svg { stroke-width: 2.2; }

  .layout { grid-template-columns: 236px 1fr; }
  .sidenav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - var(--topbar-h)); padding: 18px 12px; border-right: 1px solid var(--line); overflow-y: auto; }
  .sidenav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .9rem; }

}

/* ------------------------------------------------------------------ building blocks */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
.grid-3 { display: grid; gap: 14px; grid-template-columns: 1fr; }
.grid-4 { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 720px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.grid-2 > *, .grid-3 > *, .grid-4 > *, .stack > *, .stack-lg > * { min-width: 0; }
.grid-2.top, .grid-3.top { align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card.pad-lg { padding: 20px; }
.card.flat { box-shadow: none; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.page-head p { margin-top: 4px; color: var(--muted); }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r); background: var(--surface); }
.note { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.note svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
.disclaimer { font-size: .78rem; color: var(--muted); border-left: 3px solid var(--gold); padding: 6px 10px; background: var(--gold-soft); border-radius: 0 8px 8px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 700;
  font-size: .9rem; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, transform .05s;
}
.btn:hover { background: var(--accent-2); }
.btn:active { transform: translateY(1px); }

.btn svg { width: 17px; height: 17px; }

.btn.ghost:hover { background: var(--surface-2); }

.btn.soft:hover { background: color-mix(in srgb, var(--accent-soft) 70%, var(--accent) 12%); }
.btn.danger { background: var(--crit-soft); color: var(--crit-ink); }
.btn.small { min-height: 32px; padding: 5px 11px; font-size: .82rem; border-radius: 8px; }
.btn.block { width: 100%; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; font-size: inherit; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span, .field > label { font-size: .8rem; font-weight: 700; color: var(--ink-2); }
.field .hint { font-size: .76rem; color: var(--muted); font-weight: 400; }
input[type=text], input[type=password], input[type=email], input[type=number], input[type=date], input[type=search], input[type=tel], select, textarea {
  width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface);
  color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.form-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .form-grid.two { grid-template-columns: 1fr 1fr; } .form-grid.three { grid-template-columns: repeat(3, 1fr); } .form-grid .full { grid-column: 1 / -1; } }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice label { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 99px; font-size: .85rem; font-weight: 600; cursor: pointer; background: var(--surface); }
.choice input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.choice input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.checkline { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; }
.checkline input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }

/* ------------------------------------------------------------------ status */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 99px; font-size: .76rem; font-weight: 700; white-space: nowrap; line-height: 1.6; }
.pill i { font-style: normal; font-size: .72rem; }
.t-ok { background: var(--ok-soft); color: var(--ok-ink); }
.t-warn { background: var(--warn-soft); color: var(--warn-ink); }
.t-serious { background: var(--serious-soft); color: var(--serious-ink); }
.t-crit { background: var(--crit-soft); color: var(--crit-ink); }
.t-neutral { background: var(--neutral-soft); color: var(--neutral-ink); }
.t-info { background: var(--info-soft); color: var(--info-ink); }
.t-accent { background: var(--accent-soft); color: var(--accent); }
.t-gold { background: var(--gold-soft); color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-size: .76rem; font-weight: 600; white-space: nowrap; }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--crit); color: #fff; font-size: .7rem; font-weight: 800; }
.kuadran { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; font: 700 .8rem var(--font-display); }

.meter { position: relative; height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.meter > b { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.meter.ok > b { background: var(--ok); } .meter.warn > b { background: var(--warn); } .meter.serious > b { background: var(--serious); } .meter.crit > b { background: var(--crit); }
.meter-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.meter-row strong { font-variant-numeric: tabular-nums; font-size: .9rem; min-width: 2.2em; text-align: right; }

.strip { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.strip span { height: 8px; border-radius: 3px; background: var(--neutral-soft); }
.strip span.ok { background: var(--ok); } .strip span.warn { background: var(--warn); } .strip span.serious { background: var(--serious); }
.strip span.crit { background: var(--crit); } .strip span.na { background: var(--surface-3); }
.strip-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); }
.strip-legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ------------------------------------------------------------------ deck (kartu target) */
.deck { display: grid; gap: 12px; grid-auto-flow: column; grid-auto-columns: minmax(270px, 84%); overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px; margin: 0 -2px; }
.deck > * { scroll-snap-align: start; }
@media (min-width: 720px) { .deck { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; } }
@media (min-width: 1180px) { .deck { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tcard { position: relative; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; text-decoration: none; color: var(--ink); min-height: 236px; transition: border-color .15s, box-shadow .15s; }
a.tcard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.tcard .slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tcard .slot .eyebrow { color: var(--accent); }
.tcard .prodi { font-weight: 800; font-size: 1.02rem; line-height: 1.25; }
.tcard .pt { color: var(--muted); font-size: .84rem; }
.tcard .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.tcard .facts div { background: var(--surface-2); border-radius: 9px; padding: 7px 9px; }
.tcard .facts small { display: block; color: var(--muted); font-size: .7rem; font-weight: 600; }
.tcard .facts b { font-size: .95rem; font-variant-numeric: tabular-nums; }
.tcard.kosong { border-style: dashed; align-items: flex-start; justify-content: center; background: transparent; color: var(--muted); }
.tcard.kosong .prodi { color: var(--ink-2); }
.tcard .draf { position: absolute; top: -9px; right: 12px; }

/* ------------------------------------------------------------------ dimensi kebutuhan */
.dims { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .dims { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1180px) { .dims { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.dim { display: flex; flex-direction: column; gap: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.dim .hd { display: flex; align-items: center; justify-content: space-between; gap: 6px 8px; flex-wrap: wrap; }
.dim .hd > span:first-child { flex: 1 1 auto; min-width: 0; }
.dim .hd b { font-size: .9rem; }
.dim p { font-size: .86rem; color: var(--ink-2); }
.dim ul { margin: 0; padding-left: 18px; font-size: .84rem; }
.dim li + li { margin-top: 3px; }

/* ------------------------------------------------------------------ tabel */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.klik { cursor: pointer; }
tbody tr.klik:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.diag { font-size: .78rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; padding: 2px 2px 0; }

/* ------------------------------------------------------------------ list */
.list { display: flex; flex-direction: column; }
.list > * { padding: 11px 0; border-bottom: 1px solid var(--line); }
.list > *:last-child { border-bottom: 0; }
.todo { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
.todo .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; }
.todo .dot.tinggi { background: var(--crit); } .todo .dot.sedang { background: var(--warn); } .todo .dot.rendah { background: var(--neutral); }
.todo .when { font-size: .76rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.event { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center; }
.event .dd { text-align: center; border-radius: 10px; background: var(--surface-2); padding: 6px 0; line-height: 1.1; }
.event .dd b { display: block; font: 700 1.05rem var(--font-display); }
.event .dd small { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }

/* ------------------------------------------------------------------ angka ringkas */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.tile .lbl { font-size: .76rem; color: var(--muted); font-weight: 700; }
.tile .val { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
.tile .sub { font-size: .78rem; color: var(--muted); }
.hero-num { font: 700 2.6rem/1 var(--font-ui); letter-spacing: -.03em; }

.bars { display: flex; flex-direction: column; gap: 9px; }
.bars .b { display: grid; grid-template-columns: minmax(84px, 34%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .84rem; }
.bars .b .track { height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; position: relative; }
.bars .b .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--series-1); }
.bars .b .fill.ok { background: var(--ok); } .bars .b .fill.warn { background: var(--warn); } .bars .b .fill.serious { background: var(--serious); } .bars .b .fill.crit { background: var(--crit); } .bars .b .fill.neutral { background: var(--neutral); } .bars .b .fill.info { background: var(--info); }
.bars .b strong { font-variant-numeric: tabular-nums; min-width: 2em; text-align: right; }

/* bullet (skor subtes vs target) */
.bullet { display: grid; grid-template-columns: minmax(96px, 36%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .84rem; }
.bullet > span, .bars .b > span { min-width: 0; overflow-wrap: anywhere; }
.bars .b .pill { white-space: normal; line-height: 1.3; padding-block: 3px; max-width: 100%; }
.bullet .track { position: relative; height: 12px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.bullet .fill { position: absolute; inset: 0 auto 0 0; background: var(--series-1); border-radius: 0 4px 4px 0; }
.bullet .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }

/* ------------------------------------------------------------------ chart */
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.chart .lbl-strong { fill: var(--ink-2); font-weight: 700; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .76rem; color: var(--ink-2); margin-top: 6px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--series-1); }
.chart-legend i.dash { border-top-style: dashed; }
.chart-legend i.ref { border-top: 1px solid var(--muted); }
.chart-legend i.band { height: 10px; border: 0; background: color-mix(in srgb, var(--series-1) 16%, transparent); border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: .76rem; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); box-shadow: var(--shadow); z-index: 5; }
.tip b { display: block; }

/* ------------------------------------------------------------------ tab di halaman */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 4px; scrollbar-width: none; }
.tabs a, .tabs button { padding: 10px 12px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: .86rem; text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tabs a.on, .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: .82rem; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* ------------------------------------------------------------------ gerbang */
.gate { min-height: 100%; display: flex; flex-direction: column; }
.gate-hero { position: relative; background: var(--hero); color: #f3faf8; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px 44px; overflow: hidden; }
.gate-hero::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
  background: linear-gradient(135deg, var(--ground) 50%, transparent 50%) 0 0 / 18px 14px repeat-x,
              linear-gradient(225deg, var(--ground) 50%, transparent 50%) 0 0 / 18px 14px repeat-x;
}
.gate-hero .rebung { position: absolute; right: -40px; top: -30px; width: 260px; opacity: .13; }
.gate-inner { max-width: 1040px; margin: 0 auto; width: 100%; position: relative; }
.gate-hero .brandline { display: flex; align-items: center; gap: 12px; }
.gate-hero .brandline .brand-name { color: #fff; font-size: 1.15rem; }
.gate-hero .brandline .brand-sub { color: #cde7e1; font-size: .8rem; }
.gate-hero .brand-mark rect:nth-of-type(2) { fill: #ffffff; }
.gate-hero .brand-mark path:first-of-type { fill: var(--accent); opacity: 1; }
.gate-hero h1 { color: #fff; font-size: clamp(1.6rem, 1.1rem + 2.6vw, 2.6rem); margin-top: 26px; max-width: 18ch; }
.gate-hero .lead { margin-top: 12px; max-width: 56ch; color: #d6ece7; font-size: 1rem; }
.gate-body { max-width: 1040px; margin: -12px auto 0; width: 100%; padding: 0 16px 40px; display: flex; flex-direction: column; gap: 18px; position: relative; }
.doors { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .doors { grid-template-columns: 1fr 1.25fr; } }
/* gerbang tiga pintu: PTN utama di kanan (dua baris), PTLN & Ruang Tumbuh bertumpuk di kiri; di HP PTN tampil pertama */
@media (min-width: 760px) { .doors.tiga .door.utama { grid-column: 2; grid-row: 1 / span 2; } }
.door.kecil { flex-direction: row; align-items: flex-start; gap: 14px; padding: 16px 18px; }
.door.kecil .ico { flex: none; }
.door.kecil .isi { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.door.kecil h2 { font-size: 1.02rem; }
.door.kecil p { font-size: .86rem; }
.door.kecil .go { margin-top: 2px; font-size: .9rem; }
.door.rt .ico { background: var(--gold-soft); color: var(--gold); }
.door.rt:not(:disabled):hover { border-color: var(--gold); }
.door { display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: left; cursor: pointer; color: var(--ink); text-decoration: none; }
.door:hover { border-color: var(--accent); }
.door:disabled { cursor: not-allowed; opacity: .7; }
.door .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.door .ico svg { width: 24px; height: 24px; }
.door.utama { background: linear-gradient(160deg, var(--surface) 55%, var(--accent-soft)); }
.door h2 { font: 600 1.15rem/1.25 var(--font-display); }
.door p { color: var(--ink-2); font-size: .92rem; }
.door .jalur { display: flex; flex-wrap: wrap; gap: 6px; }
.door .go { margin-top: auto; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: var(--accent); }
.door .go svg { width: 18px; height: 18px; flex: none; }
.countdown { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.countdown .big { font: 700 2rem/1 var(--font-display); color: var(--accent); min-width: 2.4ch; text-align: center; }

/* ------------------------------------------------------------------ auth */
.auth { max-width: 440px; margin: 28px auto; width: 100%; padding-inline: 16px; }
.auth .card { padding: 22px; }
.auth h1 { font-size: 1.35rem; }
.demo-roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }

/* ------------------------------------------------------------------ overlay */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(8, 20, 18, .45); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
@media (min-width: 720px) { .overlay { align-items: center; padding: 24px; } }
.modal { background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg); padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 720px) { .modal { border-radius: 18px; } }
.modal.wide { max-width: 860px; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.modal-head .x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: .88rem; font-weight: 600; box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); }
.toast.err { background: var(--crit); color: #fff; }
@media (min-width: 960px) { .toast { bottom: 26px; } }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 30px 4px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; border-radius: 10px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; font-size: .88rem; }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.demo-bar { background: var(--gold-soft); color: var(--ink); font-size: .78rem; padding: 7px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; align-items: baseline; text-align: center; }
.demo-bar b { color: var(--ink); }
@media (max-width: 599px) { .demo-long { display: none; } }
.spark-wrap { margin-top: 2px; }
.spark { display: block; width: 100%; height: 46px; overflow: visible; }
.spark-cap { display: flex; justify-content: space-between; gap: 8px; font-size: .72rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.spark-cap .ref { color: var(--ink-2); }
.peluang-rinci { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.peluang-rinci > div { display: grid; grid-template-columns: minmax(0, 1fr) auto 3.2em; gap: 10px; align-items: center; font-size: .84rem; }
.peluang-rinci .nm { min-width: 0; overflow-wrap: anywhere; }
.peluang-rinci .pct { text-align: right; font-weight: 700; }
.demo-switch { display: inline-flex; flex-wrap: wrap; gap: 2px 12px; justify-content: center; align-items: baseline; }
.demo-switch .linkbtn { font-size: .8rem; padding: 2px 0; }
.demo-switch .linkbtn.on { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* ------------------------------------------------------------------ notifikasi, impor, konseling, laporan kelas */
.iconbtn { position: relative; flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--ink-2); cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 19px; height: 19px; }
.iconbtn .badge { position: absolute; top: -3px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; font-size: .64rem; border: 2px solid var(--surface); }
.menu.notif { width: min(380px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow-y: auto; padding: 6px; }
.menu.notif .notif-item { align-items: flex-start; gap: 10px; padding: 10px; }
.menu.notif .notif-item svg { width: 17px; height: 17px; flex: none; margin-top: 2px; color: var(--muted); }
.menu.notif .notif-item .tx { display: flex; flex-direction: column; gap: 1px; min-width: 0; overflow-wrap: anywhere; }
.menu.notif .notif-item.baru { background: var(--accent-soft); }
.menu.notif .notif-item.baru svg { color: var(--accent); }
.menu.notif .notif-item + .notif-item { margin-top: 2px; }
textarea.paste { min-height: 170px; font-size: .8rem; line-height: 1.5; white-space: pre; overflow-x: auto; tab-size: 14; }
tr.galat td { background: color-mix(in srgb, var(--crit-soft) 70%, transparent); }
details.lanjut > summary, details#hs-manual > summary { cursor: pointer; font-weight: 700; color: var(--accent); width: fit-content; }
.soft-card { background: var(--surface-2); box-shadow: none; border-color: transparent; padding: 14px 16px; }
ul.drill { margin: 0; padding-left: 18px; font-size: .84rem; color: var(--ink-2); display: grid; gap: 2px; }
.dim-ringkas { display: grid; gap: 4px; }
.dimtag { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: .74rem; font-weight: 700; margin: 1px 0; border: 1px solid var(--line); white-space: nowrap; }
.dimtag.s-siap { background: var(--ok-soft); color: var(--ok-ink); border-color: transparent; }
.dimtag.s-perhatian { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; }
.dimtag.s-belum { background: var(--serious-soft); color: var(--serious-ink); border-color: transparent; }
.dimtag.s-gagal { background: var(--crit-soft); color: var(--crit-ink); border-color: transparent; }
.dimtag.s-na { color: var(--muted); }
.sapp-page { margin-top: 18px; scroll-margin-top: calc(var(--topbar-h) + 12px); }
#rs-nilai button { font-size: .95rem; letter-spacing: -1px; color: var(--gold); }
.simpan-bar { justify-content: flex-end; position: sticky; bottom: calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom, 0px)); z-index: 5; pointer-events: none; }
.simpan-bar > * { pointer-events: auto; box-shadow: 0 6px 18px rgba(8, 40, 36, .22); }
@media (min-width: 960px) { .simpan-bar { bottom: 16px; } }
.gate .pengumuman a { font-weight: 700; }
.door .chip { white-space: normal; overflow-wrap: anywhere; }
/* kolom password dengan tombol lihat/sembunyikan */
.pw-wrap { position: relative; display: block; width: 100%; }
.pw-wrap > input { width: 100%; padding-right: 46px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.pw-eye:hover { color: var(--ink); background: var(--surface-2); }
.pw-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pw-eye[aria-pressed="true"] { color: var(--accent); }
/* kalender seleksi (Admin › Kalender seleksi): tabel di layar lebar, kartu bertumpuk di HP */
.tabel-kal .kal-tgl { white-space: nowrap; font-variant-numeric: tabular-nums; }
.tabel-kal .kal-nama { min-width: 200px; }
.tabel-kal tr.lewat { opacity: .6; }
@media (max-width: 719px) {
  .tabel-kal thead { display: none; }
  .tabel-kal, .tabel-kal tbody { display: block; }
  .tabel-kal tr { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "tgl tgl status" "nama nama nama" "jalur kat kat" "aksi aksi aksi"; gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .tabel-kal tbody tr:last-child { border-bottom: 0; }
  .tabel-kal td { display: block; padding: 0; border: 0; min-width: 0; }
  .tabel-kal .kal-tgl { grid-area: tgl; font-weight: 700; color: var(--ink-2); align-self: center; }
  .tabel-kal .kal-status { grid-area: status; }
  .tabel-kal .kal-nama { grid-area: nama; min-width: 0; }
  .tabel-kal .kal-jalur { grid-area: jalur; color: var(--muted); }
  .tabel-kal .kal-kat { grid-area: kat; color: var(--muted); }
  .tabel-kal .kal-kat:not(:empty)::before { content: '· '; }
  .tabel-kal .kal-aksi { grid-area: aksi; margin-top: 4px; }
}
#rs-nilai button.on { background: var(--gold-soft); }

/* ------------------------------------------------------------------ cetak */
.print-only { display: none; }
@media print {
  body { background: #fff; color: #000; font-size: 11pt; }
  .topbar, .sidenav, .tabbar, .no-print, .toast, .demo-bar { display: none !important; }
  .layout { display: block; }
  .main { padding: 0; max-width: none; }
  .card, .tablewrap { border-color: #bbb; break-inside: avoid; }
  .print-only { display: block; }
  .sapp-page { margin: 0; break-after: page; }
  .sapp-page:last-child { break-after: auto; }
  .sapp-page .card { border: 0; box-shadow: none; padding: 0 !important; }
  .dimtag { border: 1px solid #999 !important; background: none !important; color: #000 !important; }
  a { color: #000; text-decoration: none; }
}

</style>

<script>
/* Career Deck — aplikasi web (satu file). Berjalan di:
 *  1) GitHub Pages / hosting statis  → memanggil API Apps Script dengan fetch (APP.API_URL)

 *  3) Mode demo                       → backend asli berjalan di browser dengan data fiktif
 */
(function () {
  'use strict';

  var APP = {
    VERSION: '1.3.0',
    // URL Web App Apps Script untuk hosting di luar Apps Script (GitHub Pages).
    // Isi di baris window.CAREERDECK_API_URL di bagian <head> file index.html.
    API_URL: String(window.CAREERDECK_API_URL || '').trim()
  };

  // ================================================================ UTIL
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(v) { if (v === '' || v === null || v === undefined) return null; var n = Number(v); return isFinite(n) ? n : null; }
  function fmt(v, d) {
    var n = num(v);
    if (n === null) return '—';
    return n.toLocaleString('id-ID', { minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 1 : d });
  }
  function pct(v) { var n = num(v); return n === null ? '—' : Math.round(n * 100) + '%'; }
  var BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  /** Grafik skor TO dari waktu ke waktu + proyeksi hari-H + garis estimasi target. */

      if (!pts.length) { host.innerHTML = '<div class="empty">Belum ada hasil TO terverifikasi.</div>'; return; }
      var pr = tes.proyeksi && tes.proyeksi.nilai !== null && tes.proyeksi.metode === 'regresi_tertimbang' ? tes.proyeksi : null;
      var tT = pr ? parseD(pr.tgl_tes) : null;
      var xs = pts.map(function (p) { return +p.d; }).concat(tT ? [+tT] : []);
      var ys = pts.map(function (p) { return p.y; }).concat(pr ? [pr.bawah, pr.atas] : []).concat((refs || []).map(function (r) { return r.nilai; }));
      var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);

      var mL = 40, mR = (refs && refs.length) ? 96 : 20, mT = 12, mB = 26;
      var X = function (t) { return mL + (t - x0) / (x1 - x0) * (W - mL - mR); };
      var Y = function (v) { return mT + (1 - (v - y0) / (y1 - y0)) * (H - mT - mB); };
      var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="Grafik skor TO: ' + pts.length + ' TO, terakhir ' + fmt(pts[pts.length - 1].y) + (pr ? ', proyeksi hari tes ' + fmt(pr.nilai) : '') + '">';
      ticks.forEach(function (t) { s += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (mL - 8) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + t + '</text>'; });
      // sumbu x: bulan
      var d0 = new Date(x0), months = [];

      while (+m <= x1) { months.push(new Date(m)); m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1)); }

      for (var i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 13) labs[i].y = labs[i - 1].y + 13;
      (refs || []).forEach(function (r) { s += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + Y(r.nilai) + '" y2="' + Y(r.nilai) + '" stroke="var(--muted)" stroke-width="1" opacity=".7"/>'; });
      labs.forEach(function (l) { s += '<text x="' + (W - mR + 6) + '" y="' + (l.y + 4) + '" class="lbl-strong">' + esc(l.r.label) + '</text>'; });

        s += '<path d="M' + X(+last.d) + ' ' + Y(last.y) + ' L' + X(+tT) + ' ' + Y(pr.nilai) + '" stroke="var(--series-1)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>';

      s += '<path d="' + pts.map(function (p, j) { return (j ? 'L' : 'M') + X(+p.d) + ' ' + Y(p.y); }).join(' ') + '" stroke="var(--series-1)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>';
      pts.forEach(function (p, j) { s += '<circle data-i="' + j + '" cx="' + X(+p.d) + '" cy="' + Y(p.y) + '" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>'; });

      s += '<rect x="' + mL + '" y="' + mT + '" width="' + (W - mL - mR) + '" height="' + (H - mT - mB) + '" fill="transparent" data-hit/>';

        pts.forEach(function (p, j) { var dx = Math.abs(X(+p.d) - mx); if (dx < bd) { bd = dx; best = j; } });
        if (best === null) return;
        var p = pts[best];

        tipHtml(host, X(+p.d), Y(p.y), '<b>' + esc(p.r.nama_to || 'TO') + '</b>' + fmt(p.y) + ' · ' + fmtDate(p.r.tanggal) + (p.r.tanggal_asumsi ? ' (tgl. asumsi)' : ''));

        host.innerHTML = draf && draf.length ? '<div class="card stack"><div class="section-head"><h2>Draf rapor menunggu finalisasi</h2><span class="muted small">belum dipakai prediksi</span></div><div class="list">' + draf.map(function (x) {
          return '<div class="row-between"><div><b>' + esc(x.rombel) + ' · semester ' + x.semester + '</b><div class="small muted">' + x.n + ' siswa · ' + esc(x.sumber || '') + '</div></div><div class="row"><button class="btn small" data-final="' + esc(x.rombel) + '|' + x.semester + '">' + ic('check') + 'Finalkan</button><button class="btn ghost small" data-buang="' + esc(x.rombel) + '|' + x.semester + '">Buang</button></div></div>';
        }).join('') + '</div></div>' : '';
        $$('[data-final],[data-buang]', host).forEach(function (b) {
          b.onclick = function () {
            var buang = !!b.dataset.buang, k = (b.dataset.final || b.dataset.buang).split('|');
            konfirmasi(buang ? 'Buang draf?' : 'Finalkan rapor?', buang ? 'Draf ' + esc(k[0]) + ' semester ' + esc(k[1]) + ' dihapus. Data final tidak berubah.' : 'Rapor ' + esc(k[0]) + ' semester ' + esc(k[1]) + ' menjadi data resmi. Versi final sebelumnya diarsipkan, prediksi siswa dihitung ulang, dan siswa serta orang tua dikabari.', buang ? 'Buang' : 'Finalkan', buang).then(function (ya) {
              if (!ya) return;
              busy(b, true);
              api('finalkanRapor', { rombel: k[0], semester: +k[1], hapus: buang }).then(function (res) { S.detail = {}; toast(buang ? 'Draf dibuang' : res.jumlah + ' siswa: rapor final, prediksi diperbarui'); tampilDraf(res.draf); })
                .catch(function (e) { busy(b, false); toast(pesanError(e), true); });
            });
          };
        });
      };
      if (tab === 'rapor') api('drafRapor', {}).then(tampilDraf).catch(function () { /* abaikan */ });
    });
  }

  // ================================================================ DAFTAR VIEW
  var VIEWS = {
    gerbang: vGerbang, masuk: vMasuk, daftar: vDaftar, 'daftar-ortu': vDaftarOrtu, 'daftar-guru': vDaftarGuru, konfigurasi: vKonfigurasi,
    beranda: vBeranda, target: vTarget, kebutuhan: vKebutuhan, tes: vTes, akademik: vAkademik, prestasi: vPrestasi,
    beasiswa: vBeasiswa, checklist: vChecklist, simulasi: vSimulasi, profil: vProfil, laporan: vLaporan, lainnya: vLainnya,
    siswa: vSiswa, verifikasi: vVerifikasi, statistik: vStatistik, admin: vAdmin, akun: vAkun,
    konseling: vKonseling, hasil: vHasil, alumni: vAlumni, impor: vImpor, sapp: vSapp
  };

  // ================================================================ MULAI
  function boot() {
    applyTheme();
    // Mode demo: database hidup di memori halaman, jadi sesi lama dari muatan sebelumnya pasti tidak berlaku.
    if (S.demo) hapusSesi(); else loadSesi();
    if (!document.getElementById('root')) { var r = document.createElement('div'); r.id = 'root'; document.body.appendChild(r); }
    render();
    if (S.user) loadPublik().catch(function () { /* abaikan */ });
  }
  window.CareerDeck = { versi: APP.VERSION, render: render };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
